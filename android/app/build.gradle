apply plugin: 'com.android.application'
// LOYALTY-NATIVE-SCREENS-2026-10-20 (healer:4d9ec5cb): the native loyalty screens (gs.boldthin.loyalty.screens) are Kotlin + Compose.
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = "gs.boldthin.balfour.foundersclub"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "gs.boldthin.balfour.foundersclub"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = Integer.parseInt((project.findProperty("versionCode") ?: "262750958").toString())
        versionName = (project.findProperty("versionName") ?: "1.1.1").toString()
        // Sideload APK only: ship one ABI (the Play AAB keeps all of them; Play splits per device)
        if (project.hasProperty("apkAbi")) { ndk { abiFilters project.property("apkAbi").toString() } }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            storeFile file("../../balfour-founders-club-release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: ""
            keyPassword System.getenv("KEY_PASSWORD") ?: ""
        }
    }
    buildFeatures {
        compose = true
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'com.google.zxing:core:3.5.3'
    // LOYALTY-NATIVE-SHELL-2026-10-20 (healer:6d37d06c): document-start script for the shell's link interceptor.
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation platform('androidx.compose:compose-bom:2025.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20231013'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    // Render gate on the emulator (scripts/render-gate, healer:4b3d7c53).
    androidTestImplementation platform('androidx.compose:compose-bom:2025.06.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// LOYALTY-NATIVE-SHELL-2026-10-20 (healer:6d37d06c, port of healer:1c19eae5): the build manifest of the native screens (assets/screens.json), written
// from the `loyalty-screen` markers in the native source by the contract's emitter (boldthings-services
// definitions/loyalty_screens/emit-screens-json.sh). The screen gate reads it on the device; the release publishes the
// same file beside the APK. A build without it would quietly send every screen to the hosted page, so a missing
// emitter fails the build (-PloyaltyScreensDir=... points elsewhere).
def loyaltyScreensDir = (project.findProperty("loyaltyScreensDir") ?: "${System.getProperty('user.home')}/boldthings-services/definitions/loyalty_screens").toString()
def loyaltyScreensOut = layout.buildDirectory.dir("generated/loyalty-screens")
def emitScreensJson = tasks.register('emitScreensJson', Exec) {
    def emitter = file("$loyaltyScreensDir/emit-screens-json.sh")
    inputs.dir('src/main/java')
    inputs.file(emitter)
    inputs.file(file("$loyaltyScreensDir/screens.toml"))
    outputs.dir(loyaltyScreensOut)
    doFirst {
        if (!emitter.exists()) throw new GradleException("$emitter is missing: the build would ship no native screens (pass -PloyaltyScreensDir=<boldthings-services>/definitions/loyalty_screens)")
        loyaltyScreensOut.get().asFile.mkdirs()
    }
    commandLine 'bash', emitter.path, '--brand', 'balfour', '--src', file('src/main/java').path, '--out', loyaltyScreensOut.get().file('screens.json').asFile.path
}
android.sourceSets.main.assets.srcDir(loyaltyScreensOut)
tasks.named('preBuild') { dependsOn emitScreensJson }

kotlin {
    compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21 }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
